# error or warning(default) or ignore
# Define action of app-rootstrap-checker when it detects dependency
# other than ones that specified by the below
# allowed_buildrequires_{package|group}_name or
# allowed_buildconflicts_package_name.
# - error
#   : print error log, and cease rpmbuild with build error
# - warning
#   : print warning log, and continue rpmbuild
# - ignore
#   : keep silent, and continue rpmbuild
action_on_violation: warning

# List of packages that are subject to the app-rootstrap-checker.
# Follow pattern matching of bash(1).
target_package_name:
    - com.samsung.*

# List of package groups that are subject to the app-rootstrap-checker.
# Follow pattern matching of bash(1).
target_group_name:
    - Application*

# List of BuildRequires packages that are subject to the app-rootstrap-checker.
# If a package has BuildRequires matching any pattern in this list,
# the rule will be activated for that package.
# Follow pattern matching of bash(1).
target_buildrequires:

# List of files that are subject to the app-rootstrap-checker.
# Follow pattern matching of bash(1).
target_installed_file:
    # Platform Application on rootfs.img
    - /usr/apps/*/bin/*
    - /usr/apps/*/tizen-manifest.xml
    - /usr/apps/.preload-rw-tpk/*.tpk
    - /usr/apps/.preload-tpk/*.tpk
    - /usr/apps/.preload-rw-rpk/*.rpk
    - /usr/apps/.preload-rpk/*.rpk
    - /usr/share/packages/*.xml
    # Product Application on user.img
    - /opt/usr/apps/*/bin/*
    - /opt/usr/globalapps/*/bin/*
    - /opt/usr/globalapps/*/tizen-manifest.xml
    - /opt/share/packages/*.xml
    - /var/tmp/ses_dir/.preload-rw-tpk/*.tpk # Case for SES apps
    # Product Application on product.img
    - /product/apps/*/bin/*
    - /product/apps/*/tizen-manifest.xml
    - /product/apps/.preload-rw-tpk/*.tpk
    - /product/apps/.preload-tpk/*.tpk
    - /product/apps/.preload-rw-rpk/*.rpk
    - /product/apps/.preload-rpk/*.rpk
    - /product/share/packages/*.xml

# List of packages that are exempt from the app-rootstrap-checker.
# It is applied on top of the above 'target_package_name' and 'target_group_name'.
# Follow pattern matching of bash(1).
excluded_target_package_name:

# List of packages that are allowed to be used as BuildRequires.
# The effective allowed set is made up of allowed_buildrequires_package_name
# and allowed_buildrequires_group_name.
# Follow pattern matching of bash(1).
allowed_buildrequires_package_name:
    - dotnet-build-tools
    - pkgconfig(app-rootstrap)
    - hash-signer
    - builtin-tizensdk
    - prebuilt-tizensdk

# List of package groups that are allowed to be used as BuildRequires.
# The effective allowed set is made up of allowed_buildrequires_package_name
# and allowed_buildrequires_group_name.
# Follow pattern matching of bash(1).
allowed_buildrequires_group_name:

# List of packages that are allowed to be used as BuildConflicts
# Follow pattern matching of bash(1).
allowed_buildconflicts_package_name:

# List of packages that are allowed to be used as Requires
# Follow pattern matching of bash(1).
# FIXME: This has no effect for now. We are trying to figure out whether
#        this option is really effective or not in managing packages.
allowed_requires:
