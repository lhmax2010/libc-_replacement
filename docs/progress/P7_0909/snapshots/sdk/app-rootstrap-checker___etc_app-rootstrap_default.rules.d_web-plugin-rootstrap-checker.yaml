# error or warning(default) or ignore
# Define action of web-plugin-rootstrap-checker when it detects dependency
# other than ones that specified by the below
# allowed_buildrequires_{package|group}_name or
# allowed_buildconflicts_package_name.
# - error
#   : print error log, and cease rpmbuild with build error
# - warning
#   : print warning log, and continue rpmbuild
# - ignore
#   : keep silent, and continue rpmbuild
action_on_violation: warning

# List of packages that are subject to the web-plugin-rootstrap-checker.
# Follow pattern matching of bash(1).
target_package_name:
# profile: Public.
    - webapi-plugins
    - cordova-api
    - chromium-efl
# profile: DA.
    - webapi-plugins-da

# List of package groups that are subject to the web-plugin-rootstrap-checker.
# Follow pattern matching of bash(1).
target_group_name:

# List of BuildRequires packages that are subject to the web-plugin-rootstrap-checker.
# If a package has BuildRequires matching any pattern in this list,
# the rule will be activated for that package.
# Follow pattern matching of bash(1).
target_buildrequires:

# List of packages that are exempt from the web-plugin-rootstrap-checker.
# It is applied on top of the above 'target_package_name' and 'target_group_name'.
# Follow pattern matching of bash(1).
excluded_target_package_name:

# List of packages that are allowed to be used as BuildRequires.
# The effective allowed set is made up of allowed_buildrequires_package_name
# and allowed_buildrequires_group_name.
# Follow pattern matching of bash(1).
allowed_buildrequires_package_name:

# List of package groups that are allowed to be used as BuildRequires.
# The effective allowed set is made up of allowed_buildrequires_package_name
# and allowed_buildrequires_group_name.
# Follow pattern matching of bash(1).
allowed_buildrequires_group_name:

# List of packages that are allowed to be used as BuildConflicts
# Follow pattern matching of bash(1).
allowed_buildconflicts_package_name:

# List of packages that are allowed to be used as Requires
# Follow pattern matching of bash(1).
# FIXME: This has no effect for now. We are trying to figure out whether
#        this option is really effective or not in managing packages.
allowed_requires:

# List of files that are allowed to be installed on the target.
# Target directory name will be parsed automatically by allowed_installed_file.
# Format: Absolute path (Support wildcard (*))
allowed_installed_file:
# profile: Public 32bit
