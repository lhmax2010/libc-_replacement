########## compilation flags ##########
Macros:
# D5 PoC: source-package allowlist. RPM 4.14-safe; no %{expr}/%[...].
%d5_libcxx_allowlist d5-positive
%d5_package_cxxflags %(result=; for item in %{d5_libcxx_allowlist}; do if test "x$item" = "x%{name}"; then result='-stdlib=libc++'; fi; done; echo -n "$result")
%d5_package_ldflags %(result=; for item in %{d5_libcxx_allowlist}; do if test "x$item" = "x%{name}"; then result='-lc++ -lc++abi'; fi; done; echo -n "$result")
:Macros

%define __optflags %{__optflags_toolchain} -g2 -gdwarf-4 -pipe -Wall -Wp,-D_FORTIFY_SOURCE=2 -fexceptions -Wformat -Wformat-security -fmessage-length=0 -frecord-gcc-switches %{d5_package_cxxflags}

Optflags: armv7l %{__optflags} -march=armv7-a -mtune=cortex-a8 -mlittle-endian -mfpu=neon -mfloat-abi=softfp -mthumb -Wp,-D__SOFTFP__ -D_FILE_OFFSET_BITS=64
Optflags: armv7hl %{__optflags} -march=armv7-a -mtune=cortex-a8 -mlittle-endian -mfpu=neon -mfloat-abi=hard -mthumb -D_FILE_OFFSET_BITS=64
Optflags: aarch64 %{__optflags} -march=armv8-a+fp+simd+crc+crypto -mtune=cortex-a53
Optflags: i686 %{__optflags} -fdiagnostics-color=never -m32 -march=i686 -mtune=i686 -msse4.2 -mfpmath=sse -fasynchronous-unwind-tables -fno-omit-frame-pointer -mstackrealign
Optflags: x86_64 %{__optflags} -fdiagnostics-color=never -m64 -march=nehalem -msse4.2 -mfpmath=sse -fasynchronous-unwind-tables -fno-omit-frame-pointer
Optflags: riscv64 %{__optflags} -mabi=lp64d -march=rv64gc

%ifarch armv7l armv7hl
Macros:
%build_ldflags -Wl,-z,relro,--as-needed,-O1,--hash-style=gnu %{d5_package_ldflags}
:Macros
%endif
%ifarch i686
Macros:
%build_ldflags -Wl,-z,relro,--as-needed,-z,noseparate-code %{d5_package_ldflags}
:Macros
%endif
%ifnarch armv7l armv7hl i686
Macros:
%build_ldflags -Wl,-z,relro,--as-needed %{d5_package_ldflags}
:Macros
%endif
